name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        id: prep
        run: |
          mkdir -p release-output
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          BUILD_NUM="${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}.${BUILD_NUM}"
          APK_FILE="CalculatorVault-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-output/${APK_FILE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "Single APK prepared: $(ls -lh release-output)"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-v${{ steps.prep.outputs.version_name }}-apk
          path: release-output/${{ steps.prep.outputs.apk_file }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "Calculator Vault v${{ steps.prep.outputs.version_name }} (Build ${{ steps.prep.outputs.build_num }})"
          body: |
            ## Calculator Vault v${{ steps.prep.outputs.version_name }} (Build ${{ steps.prep.outputs.build_num }})
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            - **Built on:** ${{ github.event.head_commit.timestamp }}
            
            ### Included Asset:
            - `${{ steps.prep.outputs.apk_file }}`
            
            *Automated Release pruning active: Keeps only the latest 3 releases to preserve storage.*
          draft: false
          prerelease: false
          files: release-output/${{ steps.prep.outputs.apk_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep Latest 3)
        run: |
          echo "Pruning older releases, keeping top 3 newest..."
          OLD_TAGS=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName')
          if [ -n "$OLD_TAGS" ]; then
            for tag in $OLD_TAGS; do
              echo "Deleting old release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            done
          else
            echo "Release count is 3 or less. Nothing to delete."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
