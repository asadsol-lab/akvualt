name: Auto Build & Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/vualt111.apk
          echo "APK prepared successfully: $(ls -lh release-output/vualt111.apk)"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vualt111-release-apk
          path: release-output/vualt111.apk
          retention-days: 30

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.repository == 'bannukings123lab/Vualt-app-Ready' || github.repository == 'asadsol-lab/akvualt'
        with:
          tag_name: latest
          name: "Latest Auto-Build Release"
          body: |
            Automated build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Date: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: release-output/vualt111.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
